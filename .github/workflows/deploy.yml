name: Deploy ScentSampleNepal (CloudFormation + SSH)

on:
  push:
    branches:
      - main
  workflow_dispatch:   # Enables the manual "Run workflow" button in GitHub Actions UI

env:
  AWS_REGION: us-east-1
  STACK_NAME: scentsamplenepal-stack

jobs:
  # -------------------------------------------------------------
  # JOB 1: BUILD FRONTEND (Runs on GitHub's 7GB runner, NOT EC2)
  # -------------------------------------------------------------
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Compile React
        env:
          VITE_API_URL: /api
        run: |
          cd frontend
          npm install
          npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # -------------------------------------------------------------
  # JOB 2: DEPLOY TO AWS EC2
  # -------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy CloudFormation Stack
        run: |
          aws cloudformation deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --template-file infra/ec2-instance.yaml \
            --parameter-overrides InstanceType=t2.micro \
            --no-fail-on-empty-changeset \
            --region ${{ env.AWS_REGION }}

      - name: Get EC2 Public IP
        id: get-ip
        run: |
          IP=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='PublicIP'].OutputValue" \
            --output text)
          echo "EC2_IP=$IP" >> $GITHUB_OUTPUT
          echo "Server IP: $IP"

      - name: Get SSH Key from SSM Parameter Store
        id: get-key
        run: |
          SSM_PATH=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='SSMKeyPath'].OutputValue" \
            --output text)
          aws ssm get-parameter \
            --name "$SSM_PATH" \
            --with-decryption \
            --region ${{ env.AWS_REGION }} \
            --query "Parameter.Value" \
            --output text > /tmp/scent-key.pem
          chmod 600 /tmp/scent-key.pem

      - name: Wait for SSH Availability
        run: |
          IP=${{ steps.get-ip.outputs.EC2_IP }}
          echo "Waiting for SSH to be fully ready and authenticated on $IP..."
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no \
                   -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=5 \
                   -o BatchMode=yes \
                   -i /tmp/scent-key.pem \
                   ubuntu@"$IP" "echo 'SSH is ready'" 2>/dev/null; then
              echo "SSH handshake and authentication succeeded!"
              sleep 5
              exit 0
            fi
            echo "Waiting for SSH authentication on $IP... ($i/30)"
            sleep 10
          done
          echo "Timed out waiting for SSH."
          exit 1

      - name: Deploy Application via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          EC2_IP: ${{ steps.get-ip.outputs.EC2_IP }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ steps.get-ip.outputs.EC2_IP }}
          username: ubuntu
          key_path: /tmp/scent-key.pem
          timeout: 60s
          command_timeout: 15m
          script_stop: true
          envs: EC2_IP,MONGO_URI,JWT_SECRET
          script: |
            echo ">>> [0/5] Ensuring 2GB swap space is enabled..."
            if [ ! -f /swapfile ]; then
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile || true
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            echo ">>> [1/5] Waiting for cloud-init bootstrap..."
            sudo cloud-init status --wait || true

            echo ">>> [2/5] Pulling latest repository code..."
            if [ ! -d /var/www/app/.git ]; then
              sudo mkdir -p /var/www/app
              sudo chown -R ubuntu:ubuntu /var/www/app
              git clone https://github.com/Prince-KC/ScentSample.git /var/www/app
            fi
            cd /var/www/app
            git fetch origin main
            git reset --hard origin/main

            echo ">>> [3/5] Installing backend dependencies..."
            cd /var/www/app/backend
            npm install --omit=dev

            echo ">>> [4/5] Injecting production .env file..."
            printf "%s\n" \
              "PORT=8000" \
              "NODE_ENV=production" \
              "CLIENT_URL=http://$EC2_IP" \
              "MONGO_URI=$MONGO_URI" \
              "JWT_SECRET=$JWT_SECRET" \
              > /var/www/app/backend/.env

            echo ">>> [5/5] Building frontend and reloading PM2/Nginx..."
            cd /var/www/app/frontend
            npm install
            npm run build

            cd /var/www/app/backend
            pm2 delete all 2>/dev/null || true
            pm2 start ecosystem.config.cjs --update-env
            pm2 save
            sudo cp /var/www/app/infra/nginx.conf /etc/nginx/sites-available/scentsamplenepal
            sudo ln -sf /etc/nginx/sites-available/scentsamplenepal /etc/nginx/sites-enabled/scentsamplenepal
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl reload nginx

      - name: Print Live URL
        run: echo "🎉 Live site at http://${{ steps.get-ip.outputs.EC2_IP }}"

      - name: Cleanup Temporary Key
        if: always()
        run: rm -f /tmp/scent-key.pem
