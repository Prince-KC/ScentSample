name: Deploy ScentSampleNepal to AWS EC2

# Trigger: runs every time code is pushed to the main branch
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout source code ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Set up Node.js with caching ───────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── Step 3: Build the React frontend ──────────────────────────────────────
      # Sets VITE_API_URL=/api so all axios calls go through Nginx → backend
      - name: Install frontend dependencies & build
        working-directory: frontend
        run: |
          npm install --include=dev
          chmod -R +x node_modules/.bin || true
          npm run build
        env:
          VITE_API_URL: /api

      # ── Step 4: Configure AWS credentials ─────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ── Step 5: Verify or create the CloudFormation stack ─────────────────────
      - name: Deploy CloudFormation infrastructure (create or verify)
        run: |
          STACK_NAME="scentsamplenepal-stack"
          REGION="${{ vars.AWS_REGION }}"

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$REGION" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          if [ "$STATUS" == "DOES_NOT_EXIST" ] || [ "$STATUS" == "DELETE_COMPLETE" ]; then
            echo "Stack not found — creating new CloudFormation stack..."
            aws cloudformation create-stack \
              --stack-name "$STACK_NAME" \
              --template-body file://infra/ec2-instance.yaml \
              --region "$REGION"
            aws cloudformation wait stack-create-complete \
              --stack-name "$STACK_NAME" --region "$REGION"
            echo "Stack created successfully."
          else
            echo "Stack already exists (status: $STATUS). Skipping creation."
          fi

      # ── Step 6: Fetch EC2 IP and SSH private key from AWS ─────────────────────
      - name: Get EC2 public IP and SSH key from AWS
        id: get_infra
        run: |
          STACK_NAME="scentsamplenepal-stack"
          REGION="${{ vars.AWS_REGION }}"

          EC2_IP=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PublicIP'].OutputValue" \
            --output text)

          KEY_PATH=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" --region "$REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='SSMKeyPath'].OutputValue" \
            --output text)

          SSH_KEY=$(aws ssm get-parameter \
            --name "$KEY_PATH" \
            --with-decryption \
            --region "$REGION" \
            --query "Parameter.Value" --output text)

          echo "EC2_IP=$EC2_IP" >> $GITHUB_OUTPUT
          echo "$SSH_KEY" > /tmp/ssh_key.pem
          chmod 600 /tmp/ssh_key.pem
          echo "SSH key saved. EC2 IP: $EC2_IP"

      # ── Step 7: Wait until EC2 SSH is ready ───────────────────────────────────
      - name: Wait for EC2 to be SSH-ready
        run: |
          EC2_IP=${{ steps.get_infra.outputs.EC2_IP }}
          echo "Waiting for SSH on $EC2_IP..."
          for i in $(seq 1 24); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
              -i /tmp/ssh_key.pem ubuntu@$EC2_IP "echo ready" 2>/dev/null; then
              echo "SSH is ready."
              break
            fi
            echo "Attempt $i/24 — retrying in 10s..."
            sleep 10
          done

      # ── Step 8: Deploy code on the EC2 server ─────────────────────────────────
      - name: SSH into EC2 and deploy
        run: |
          EC2_IP=${{ steps.get_infra.outputs.EC2_IP }}

          ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key.pem ubuntu@$EC2_IP << 'ENDSSH'
            set -e
            APP_DIR="/var/www/app"

            echo "=== Waiting for cloud-init / UserData to finish if running ==="
            while [ ! -f /var/lib/cloud/instance/boot-finished ]; do
              echo "Waiting for instance initialization..."
              sleep 5
            done

            echo "=== Ensuring Node.js, Nginx, PM2 are ready ==="
            command -v pm2 >/dev/null 2>&1 || sudo npm install -g pm2
            command -v nginx >/dev/null 2>&1 || (sudo apt-get update -y && sudo apt-get install -y nginx)

            echo "=== Ensuring application code is present ==="
            if [ ! -d "$APP_DIR/.git" ]; then
              sudo rm -rf $APP_DIR
              sudo mkdir -p $APP_DIR
              sudo chown -R ubuntu:ubuntu $APP_DIR
              git clone https://github.com/Prince-KC/ScentSample.git $APP_DIR
            else
              cd $APP_DIR
              git pull origin main
            fi

            cd $APP_DIR

            echo "=== Writing .env file for backend ==="
            printf "NODE_ENV=production\nPORT=8000\nMONGO_URI=%s\nJWT_SECRET=%s\n" "${{ secrets.MONGO_URI }}" "${{ secrets.JWT_SECRET }}" > $APP_DIR/backend/.env

            echo "=== Installing backend dependencies ==="
            cd $APP_DIR/backend
            npm install --omit=dev

            echo "=== Installing frontend dependencies & rebuilding ==="
            cd $APP_DIR/frontend
            npm install --include=dev
            chmod -R +x node_modules/.bin || true
            VITE_API_URL=/api npm run build

            echo "=== Configuring Nginx ==="
            sudo cp -f $APP_DIR/infra/nginx.conf /etc/nginx/sites-available/scentsamplenepal
            sudo ln -sf /etc/nginx/sites-available/scentsamplenepal /etc/nginx/sites-enabled/scentsamplenepal
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl enable nginx
            sudo systemctl restart nginx

            echo "=== Creating PM2 log directory ==="
            sudo mkdir -p /var/log/pm2
            sudo chown -R ubuntu:ubuntu /var/log/pm2

            echo "=== Starting / Reloading PM2 ==="
            cd $APP_DIR/backend
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
            pm2 startup systemd -u ubuntu --hp /home/ubuntu 2>/dev/null || true

            echo "=== Deployment Complete ==="
            pm2 status
          ENDSSH

      # ── Step 9: Verify site is live ───────────────────────────────────────────
      - name: Verify live site responds
        run: |
          EC2_IP=${{ steps.get_infra.outputs.EC2_IP }}
          echo "Testing http://$EC2_IP/health ..."
          sleep 5
          curl --fail --max-time 15 http://$EC2_IP/health
          echo ""
          echo "✅ ScentSampleNepal is live at: http://$EC2_IP"
