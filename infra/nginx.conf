server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow large image uploads (product photos, etc.)
    client_max_body_size 15M;

    # ── 1. FRONTEND ─────────────────────────────────────────────────────────────
    # Serve the compiled React/Vite build (frontend/dist/)
    root /var/www/app/frontend/dist;
    index index.html;

    # SPA fallback: React Router handles all routes — never 404 on page refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 2. BACKEND API ──────────────────────────────────────────────────────────
    # The frontend sends all API calls to /api/* in production.
    # Nginx strips the /api prefix and forwards to Express on port 8000.
    #
    # Example:  GET /api/product  →  Express: GET /product
    #           POST /api/user    →  Express: POST /user
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # ── 3. HEALTH CHECK ─────────────────────────────────────────────────────────
    # Simple endpoint GitHub Actions uses to verify server is alive
    location /health {
        return 200 'ScentSampleNepal OK';
        add_header Content-Type text/plain;
    }

    # ── 4. LOGGING ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/scentsamplenepal.access.log;
    error_log  /var/log/nginx/scentsamplenepal.error.log;
}
